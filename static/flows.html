<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>测评流程图 · 测评聚合平台</title>
<style>
  :root {
    --bg: #f5f7fa; --card: #fff; --line: #e4e8ef; --txt: #24292f;
    --muted: #6a737d; --blue: #0969da; --green: #1a7f37; --orange: #9a6700; --red: #cf222e;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--txt); }
  header { background: #1b2430; color: #fff; padding: 12px 22px; display: flex; align-items: center; gap: 14px; }
  header b { font-size: 16px; }
  header .sub { color: #b9c2ce; font-size: 12px; }
  header a { margin-left: auto; color: #79b8ff; text-decoration: none; font-size: 13px; }
  header a:hover { text-decoration: underline; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 18px 20px 46px; }
  .tabs { display: flex; gap: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 4px; width: fit-content; margin-bottom: 14px; }
  .tabs button { background: transparent; color: var(--txt); border: 0; border-radius: 6px;
    padding: 7px 16px; cursor: pointer; font-size: 13px; }
  .tabs button.active { background: var(--blue); color: #fff; }
  .caption { font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.7; }
  .board { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; overflow-x: auto; }
  svg text { font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; }
  .legend .dia { width: 0; height: 0; border-radius: 0; background: none; border-left: 5px solid transparent;
    border-right: 5px solid transparent; border-bottom: 9px solid var(--red); margin-right: 6px; }
</style>
</head>
<body>
<header>
  <b>📊 测评流程图</b>
  <span class="sub">每个测评一张流程 · 与平台实现（脚本/产物文件）一一对应</span>
  <a href="/#/guide">← 返回测评指南</a>
</header>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="caption" id="cap"></div>
  <div class="board"><svg id="cv" width="1000" height="700"></svg></div>
  <div class="legend">
    <span><i style="background:var(--blue)"></i>数据 / 考卷</span>
    <span><i style="background:var(--orange)"></i>执行进程</span>
    <span><i style="background:var(--green)"></i>产物 / 结果</span>
    <span><i style="background:#6f42c1"></i>平台界面</span>
    <span><i class="dia"></i>判断分支（菱形）</span>
    <span>虚线 = 旁注 / 分支去向；实线箭头 = 主流程</span>
  </div>
</div>
<script>
/* 颜色约定与指南页一致 */
const C = { data: "#0969da", proc: "#9a6700", out: "#1a7f37", ui: "#6f42c1", decision: "#cf222e" };
const NW = 264, NH = 58, GAP = 34, CX = 330, SX = 672, SW = 268, DW = 252, DH = 88;

const FLOWS = {
rag: {
  name: "📚 RAG 测评",
  cap: "同一套考题 × 6 种检索方式：先 retrieve 生成「答卷」，再由 ragas 逐题打分；答卷内容指纹 + 检索参数指纹，保证界面展示的永远是当前口径的分数。",
  nodes: [
    { t: "data", title: "题集 eval_questions.jsonl", sub: "问题 + 标准答案要点（+黄金段落）",
      side: { title: "题集管理页", lines: ["手动添加，或「AI 合成」从语料", "自动生成 → 人工审核采纳入库"] } },
    { t: "proc", title: "retrieve.py · 重新检索", sub: "6 模式 × 公共检索参数",
      side: { title: "6 种检索方式", lines: ["naive / local / global", "hybrid / mix / bypass 直答"] } },
    { t: "out", title: "答卷 eval_{模式}.jsonl", sub: "每题 = 检索上下文 + 生成回答" },
    { t: "decision", title: "检索参数或题集变过？", yes: "没变",
      branch: { label: "变了", title: "旧数据自动失效", lines: ["参数指纹变化 → 旧答卷与旧分数", "自动过期，需重新检索再评测"], loopTo: 1, loopLabel: "重新检索" } },
    { t: "proc", title: "evaluate.py · ragas 评测", sub: "18 项指标 × 勾选的模式（可多选）",
      side: { title: "断点续跑", lines: ["按 题×指标 逐条缓存 scores_cache", "中断再跑只补缺口，不重复扣费"] } },
    { t: "out", title: "分数 + 报告 + 归档", sub: "scores_cache.json · eval_report.md" },
    { t: "ui", title: "平台展示", sub: "模式对比雷达 / 逐题明细 / 趋势图" },
  ],
},
llm: {
  name: "🎓 LLM 基准",
  cap: "模型登记 → 预检防空烧 → 限题控费 → 推理（唯一花 API 费用的阶段）→ 本地判卷（复用推理产物）→ 成绩矩阵。六大基准全部本地化。",
  nodes: [
    { t: "data", title: "模型登记 models.json", sub: "模型名 + Base URL + Key + 思考强度",
      side: { title: "模型管理页维护", lines: ["思考强度五档：default / off", "low / medium / high"] } },
    { t: "proc", title: "预检 · ping 一次", sub: "验证 模型名 / 密钥 / 端点" },
    { t: "decision", title: "预检通过？", yes: "通过",
      branch: { label: "不通过", title: "就地报错 · 不启动", lines: ["密钥/端点不对时快速失败", "避免开跑后空烧重试"] } },
    { t: "proc", title: "网关参数协商", sub: "temperature / 思考强度，被拒则回退" },
    { t: "proc", title: "生成限题副本 + lite 配置", sub: "每子集只取前 N 题控费",
      side: { title: "限题口径", lines: ["C-Eval 每科 5 题 = 260 题", "GSM8K / HellaSwag 限 300 题"] } },
    { t: "proc", title: "opencompass · 推理 infer", sub: "默认 2 worker × 1 qps 防限流",
      side: { title: "唯一花 API 费用的阶段", lines: ["并发别乱调", "高调可能直接 429 全灭"] } },
    { t: "proc", title: "判卷 eval --reuse", sub: "复用推理产物 · 本地比对不花钱",
      side: { title: "C-Eval 定制判卷", lines: ["smart_ceval_postprocess", "智能提取答案字母，勿改回官方版"] } },
    { t: "out", title: "成绩矩阵 latest.json", sub: "模型 × 基准 + history.jsonl + 归档" },
    { t: "ui", title: "平台展示", sub: "成绩矩阵 / 学科雷达 / 历史·日志" },
  ],
},
agent: {
  name: "🤖 智能体测评",
  cap: "任务集自带期望标注 → 智能体真实执行生成轨迹 → 双口径评分（客观核验为主，裁判兜底）。业界 AgentBench 等同款「环境+轨迹+终态判定」方法论的业务化落地。",
  nodes: [
    { t: "proc", title: "启动智能体服务 :8820", sub: "智能体页「启动服务」",
      side: { title: "Langfuse（可选）", lines: ["配了 key 需重启服务生效", "之后轨迹自动上报云端"] } },
    { t: "data", title: "任务集 tasks.jsonl · 6 题", sub: "expect_tools / expect_file / 关键词 / 记忆",
      side: { title: "期望标注需校准", lines: ["对着真实语料数过命中次数", "如「贾宝玉」在语料命中 12 处"] } },
    { t: "proc", title: "main.py --all 逐题执行", sub: "真实调用工具 + 产生文件副作用" },
    { t: "out", title: "轨迹 trajectories-*.jsonl", sub: "每题的工具调用序列 + 最终回答" },
    { t: "proc", title: "eval_agent.py · 双口径评分",
      side: { title: "两种判分", lines: ["客观：tool_recall / answer_hit / file_hit", "裁判：tool_call_accuracy / goal_accuracy"] } },
    { t: "out", title: "agent_scores.json", sub: "5 项分数 + 每轮自动归档" },
    { t: "ui", title: "平台展示", sub: "指标卡 / 历史轮次 / Langfuse 轨迹" },
  ],
},
redteam: {
  name: "🛡️ 安全红队",
  cap: "攻击用例在线可配 → 动态生成 promptfoo 配置 → 逐条打靶机 → 裁判按该用例自己的 rubric 判定。pass = 防御成功，fail = 发现漏洞（方向别搞反）。",
  nodes: [
    { t: "data", title: "攻击用例库 cases.json", sub: "attack_type + prompt + rubric · 在线增删" },
    { t: "proc", title: "检查靶机", sub: "红队靶机 = 智能体服务 :8820" },
    { t: "decision", title: "靶机已启动？", yes: "是",
      branch: { label: "否", title: "拒绝扫描", lines: ["提示「靶机未启动」", "先去智能体页启动服务"] } },
    { t: "proc", title: "生成 dyn_redteam.yaml", sub: "用例 → promptfoo 原生配置" },
    { t: "proc", title: "promptfoo eval", sub: "攻击 prompt 逐条打到靶机 /chat" },
    { t: "proc", title: "裁判 llm-rubric 判定", sub: "按该用例自己的 rubric 逐条判",
      side: { title: "方向别搞反", lines: ["pass = 防御成功（攻击被挡下）", "fail = 发现漏洞（攻击得手）"] } },
    { t: "out", title: "result.json · 漏洞清单", sub: "通过率 + 逐条明细 · 读取时自动归档" },
    { t: "ui", title: "平台展示", sub: "漏洞清单 / 历史通过率趋势" },
  ],
},
};

const cv = document.getElementById("cv");
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function sideBox(x, y, side, accent) {
  const lh = side.lines.length, h = 24 + lh * 16 + 8;
  let s = `<rect x="${x}" y="${y}" width="${SW}" height="${h}" rx="8" fill="#fafbfc" stroke="${accent || "#c8d1db"}" stroke-dasharray="4 3"/>`;
  s += `<text x="${x + 12}" y="${y + 17}" font-size="11.5" font-weight="700" fill="#4a5560">${esc(side.title)}</text>`;
  side.lines.forEach((l, i) => {
    s += `<text x="${x + 12}" y="${y + 34 + i * 16}" font-size="10.5" fill="#6a737d">${esc(l)}</text>`;
  });
  return { svg: s, h };
}

function render(key) {
  const f = FLOWS[key];
  const pos = [];
  let y = 26;
  f.nodes.forEach(n => { const h = n.t === "decision" ? DH : NH; pos.push({ y, h, mid: y + h / 2 }); y += h + GAP; });

  const P = [`<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
    orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#94a3b8"/></marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7"
    orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="#cf222e"/></marker></defs>`];

  // 主流程箭头
  for (let i = 0; i < f.nodes.length - 1; i++) {
    const a = pos[i], b = pos[i + 1];
    P.push(`<line x1="${CX}" y1="${a.y + a.h}" x2="${CX}" y2="${b.y - 2}" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>`);
    if (f.nodes[i].t === "decision")
      P.push(`<text x="${CX + 10}" y="${(a.y + a.h + b.y) / 2 + 4}" font-size="11.5" fill="#1a7f37" font-weight="700">${esc(f.nodes[i].yes || "是")}</text>`);
  }

  f.nodes.forEach((n, i) => {
    const p = pos[i];
    if (n.t === "decision") {
      P.push(`<polygon points="${CX},${p.y} ${CX + DW / 2},${p.mid} ${CX},${p.y + p.h} ${CX - DW / 2},${p.mid}"
        fill="#fff" stroke="${C.decision}" stroke-width="1.6"/>`);
      P.push(`<text x="${CX}" y="${p.mid + 4}" font-size="12.5" font-weight="700" text-anchor="middle">${esc(n.title)}</text>`);
      // 分支：菱形右顶点 → 分支框
      if (n.branch) {
        const b = n.branch;
        const bs = sideBox(SX, p.mid - (24 + b.lines.length * 16 + 8) / 2, b, C.decision);
        const by = p.mid - bs.h / 2;
        P.push(`<line x1="${CX + DW / 2}" y1="${p.mid}" x2="${SX - 4}" y2="${p.mid}" stroke="${C.decision}" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ahr)"/>`);
        P.push(`<text x="${(CX + DW / 2 + SX) / 2}" y="${p.mid - 7}" font-size="11.5" fill="${C.decision}" font-weight="700" text-anchor="middle">${esc(b.label)}</text>`);
        P.push(sideBox(SX, by, b, C.decision).svg);
        // 回环：分支框顶 → 最右侧绕行到顶部 → 沿左侧空档下来 → 从目标节点左缘进入（不碰任何框）
        if (b.loopTo != null) {
          const t = pos[b.loopTo], lx = SX + SW + 24, tx = 150;
          P.push(`<path d="M ${lx} ${by} L ${lx} 12 L ${tx} 12 L ${tx} ${t.mid} L ${CX - NW / 2 - 4} ${t.mid}"
            fill="none" stroke="${C.proc}" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/>`);
          P.push(`<text x="${(tx + lx) / 2}" y="10" font-size="11" fill="${C.proc}" text-anchor="middle">${esc(b.loopLabel || "返回")}</text>`);
        }
      }
    } else {
      const col = C[n.t], x = CX - NW / 2;
      P.push(`<rect x="${x}" y="${p.y}" width="${NW}" height="${NH}" rx="9" fill="#fff" stroke="${col}" stroke-width="1.5"/>`);
      P.push(`<rect x="${x}" y="${p.y + 6}" width="5" height="${NH - 12}" rx="2" fill="${col}"/>`);
      P.push(`<text x="${x + 17}" y="${p.y + (n.sub ? 23 : 34)}" font-size="13" font-weight="700">${esc(n.title)}</text>`);
      if (n.sub) P.push(`<text x="${x + 17}" y="${p.y + 42}" font-size="11" fill="#6a737d">${esc(n.sub)}</text>`);
      if (n.side) {
        P.push(`<line x1="${x + NW}" y1="${p.mid}" x2="${SX - 4}" y2="${p.mid}" stroke="#c8d1db" stroke-width="1.2" stroke-dasharray="4 3"/>`);
        P.push(sideBox(SX, p.mid - (24 + n.side.lines.length * 16 + 8) / 2, n.side).svg);
      }
    }
  });
  cv.setAttribute("height", y + 6);
  cv.innerHTML = P.join("");
  document.getElementById("cap").textContent = f.cap;
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.k === key));
}

document.getElementById("tabs").innerHTML = Object.entries(FLOWS)
  .map(([k, f]) => `<button data-k="${k}" onclick="location.hash='${k}'">${f.name}</button>`).join("");

function current() { const k = (location.hash || "#rag").slice(1); return FLOWS[k] ? k : "rag"; }
window.addEventListener("hashchange", () => render(current()));
render(current());
</script>
</body>
</html>
